<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Link Shortener & QR Generator</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1a103c, #0d0b18);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-box {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 6px;
            transition: 0.3s ease;
        }

        .input-box:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .input-box input::placeholder {
            color: #64748b;
        }

        .input-box button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-box button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Result Section */
        .result-box {
            display: none;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            animation: fadeIn 0.4s ease forwards;
        }

        .url-details {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .short-url {
            color: #38bdf8;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            word-break: break-all;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-btn.copied {
            background: #22c55e;
            border-color: #22c55e;
            color: #ffffff;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .qr-section p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        #qrcode {
            background: white;
            padding: 10px;
            border-radius: 12px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .input-box {
                flex-direction: column;
                gap: 8px;
                background: transparent;
                border: none;
                padding: 0;
            }

            .input-box input {
                background: rgba(15, 23, 42, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 12px;
            }

            .input-box button {
                justify-content: center;
                width: 100%;
            }
            
            .url-details {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Link Shortener & QR Code</h1>
            <p>Apne links short karein aur Instant QR Code generate karein</p>
        </div>

        <div class="input-box">
            <input type="url" id="longUrl" placeholder="Paste your long link here..." required>
            <button onclick="shortenUrl()">
                <span>Shorten</span>
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="url-details">
                <a href="#" id="shortUrl" target="_blank" class="short-url"></a>
                <button class="copy-btn" id="copyBtn" onclick="copyLink()">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>

            <div class="qr-section">
                <p>Scan QR Code:</p>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script>
        let qrcodeInstance = null;

        async function shortenUrl() {
            let longUrl = document.getElementById('longUrl').value.trim();
            const resultBox = document.getElementById('resultBox');
            const shortUrlLink = document.getElementById('shortUrl');
            const copyBtn = document.getElementById('copyBtn');
            const qrContainer = document.getElementById('qrcode');

            if (!longUrl) {
                alert('Meharbani karke URL enter karein!');
                return;
            }

            // Ensure protocol is present
            if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
                longUrl = 'https://' + longUrl;
            }

            const btn = document.querySelector('.input-box button');
            btn.innerHTML = 'Shortening...';

            try {
                // Free TinyURL API endpoint (CORS Friendly)
                const response = await fetch(`https://api.tinyurl.com/create?api_token=api_key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: longUrl })
                }).catch(() => null);

                let shortLink = "";

                // Fallback using clean TinyURL direct endpoint
                const fallbackRes = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (fallbackRes.ok) {
                    shortLink = await fallbackRes.text();
                }

                if (shortLink) {
                    shortUrlLink.href = shortLink;
                    shortUrlLink.innerText = shortLink;
                    
                    // Generate QR Code
                    qrContainer.innerHTML = "";
                    qrcodeInstance = new QRCode(qrContainer, {
                        text: shortLink,
                        width: 128,
                        height: 128,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    resultBox.style.display = 'flex';
                    
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                } else {
                    alert('Link shorten nahi ho saka. Valid URL check karein.');
                }
            } catch (error) {
                alert('Kuch masla hua, dubara koshish karein.');
            } finally {
                btn.innerHTML = '<span>Shorten</span> <i class="fa-solid fa-wand-magic-sparkles"></i>';
            }
        }

        function copyLink() {
            const shortUrl = document.getElementById('shortUrl').innerText;
            const copyBtn = document.getElementById('copyBtn');

            navigator.clipboard.writeText(shortUrl).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
                
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                }, 2000);
            });
        }
    </script>
</body>
</html>
